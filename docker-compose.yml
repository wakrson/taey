services:
  dev:
    image: dev
    build:
      context: .
      target: dev
      args:
        USER: ${USER}
    ports:
      - "9876:9876"
    environment:
      - DISPLAY=${DISPLAY}
      - USER=${USER}
      - CLAUDE_CONFIG_DIR=/home/${USER}/.claude
    volumes:
      - ./:/home/${USER}/dev/taey
      - ./.claude-container:/home/${USER}/.claude
      - /tmp/.X11-unix:/tmp/.X11-unix
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    group_add:
      - "${RENDER_GID:-110}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  runtime:
    image: runtime
    build:
      context: .
      target: runtime
      args:
        USER: ${USER}
    environment:
      - DISPLAY=${DISPLAY}
      - USER=${USER}
    volumes:
      - ./:/home/${USER}/dev/taey
      - /tmp/.X11-unix:/tmp/.X11-unix
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    group_add:
      - "${RENDER_GID:-110}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
