# CLIP/SigLIP TensorRT engine used for place-recognition embeddings.
encoder: models/clip/clip.engine
depth_scale: 1.0
max_depth: 6.0

# tum example
# Keyframe selection: keyframe_stride is a compute pre-filter (only every nth
# frame is processed at all). Of the processed frames, one is skipped when at
# least keyframe_max_overlap of its features match existing map points AND the
# mean ray angle to those points changed less than keyframe_min_parallax
# degrees since the previous keyframe.
keyframe_stride: 1
keyframe_max_overlap: 0.5
keyframe_min_parallax: 1.0
num_neighbors: 20         # embedding-index neighbors for loop closure

# clip example (place-recognition eval)
num_queries: 25       # evenly-spaced query frames sampled from the sequence
k: 100                # nearest neighbours retrieved per query

# rs example (Intel RealSense live)
rs_width: 640
rs_height: 480
rs_fps: 30
rs_margin: 0.08